<svg class="fig fig-architecture" viewBox="0 0 980 600" width="100%" role="img" aria-labelledby="figArchTitle figArchDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="figArchTitle">XML feed-forward plus a lightweight network</title>
  <desc id="figArchDesc">Current state feeds an XML feed-forward layer (anchors, direction, safety red lines) and a lightweight network with frozen weights. Their outputs merge as baseline plus delta into a continuous decision.</desc>
  <style>
    .fig-architecture { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .fig-architecture text { fill: var(--text-primary, #2c3e50); }
    .fig-architecture .muted { fill: var(--text-tertiary, #7f8c8d); }
    .fig-architecture .secondary { fill: var(--text-secondary, #34495e); }
    .fig-architecture .box { fill: rgba(255,255,255,.92); stroke: var(--border-color, #dddddd); stroke-width: 1.5; }
    .fig-architecture .panel-title { font-size: 17px; font-weight: 600; }
    .fig-architecture .panel-sub { font-size: 13px; }
    .fig-architecture .card { fill: rgba(255,255,255,.75); stroke: var(--border-color, #dddddd); stroke-width: 1.2; rx: 8; }
    .fig-architecture .card-label { font-size: 15px; font-weight: 600; }
    .fig-architecture .card-desc { font-size: 12.5px; }
    .fig-architecture .accent-bar { fill: #0083b0; }
    .fig-architecture .warn-bar { fill: #e74c3c; }
    .fig-architecture .amber-bar { fill: #e67e22; }
    .fig-architecture .accent-text { fill: #0083b0; font-weight: 600; }
    .fig-architecture .warn-text { fill: #e74c3c; font-weight: 600; }
    .fig-architecture .amber-text { fill: #e67e22; font-weight: 600; }
    .fig-architecture .flow { stroke: #0083b0; stroke-width: 2; fill: none; }
    .fig-architecture .flow-dash { stroke: #0083b0; stroke-width: 2; fill: none; stroke-dasharray: 7 7; animation: figArchDash 2.6s linear infinite; }
    .fig-architecture .flow-amber { stroke: #e67e22; stroke-width: 2.2; fill: none; stroke-dasharray: 8 6; animation: figArchDashRev 3.2s linear infinite; }
    .fig-architecture .arrow { fill: var(--text-tertiary, #7f8c8d); }
    .fig-architecture .pulse { animation: figArchPulse 3.4s ease-in-out infinite; transform-origin: center; }
    .fig-architecture .delta-tag { font-size: 14px; font-weight: 700; }
    .fig-architecture .note { font-size: 12.5px; }
    .fig-architecture .note-box { fill: rgba(0,131,176,.08); stroke: rgba(0,131,176,.35); stroke-width: 1; rx: 8; }
    [data-theme="dark"] .fig-architecture .box { fill: rgba(45,45,63,.95); }
    [data-theme="dark"] .fig-architecture .card { fill: rgba(45,45,63,.8); }
    [data-theme="dark"] .fig-architecture .accent-bar { fill: #3fb6d8; }
    [data-theme="dark"] .fig-architecture .warn-bar { fill: #ff6b5e; }
    [data-theme="dark"] .fig-architecture .amber-bar { fill: #f0a04b; }
    [data-theme="dark"] .fig-architecture .accent-text { fill: #3fb6d8; }
    [data-theme="dark"] .fig-architecture .warn-text { fill: #ff6b5e; }
    [data-theme="dark"] .fig-architecture .amber-text { fill: #f0a04b; }
    [data-theme="dark"] .fig-architecture .flow,
    [data-theme="dark"] .fig-architecture .flow-dash { stroke: #3fb6d8; }
    [data-theme="dark"] .fig-architecture .flow-amber { stroke: #f0a04b; }
    [data-theme="dark"] .fig-architecture .note-box { fill: rgba(63,182,216,.10); stroke: rgba(63,182,216,.35); }
    @keyframes figArchDash { to { stroke-dashoffset: -56; } }
    @keyframes figArchDashRev { to { stroke-dashoffset: 56; } }
    @keyframes figArchPulse { 0%,100% { opacity: .55; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .fig-architecture .flow-dash,
      .fig-architecture .flow-amber,
      .fig-architecture .pulse { animation: none !important; opacity: 1 !important; }
    }
  </style>

  <!-- title -->
  <text x="24" y="34" class="panel-title">XML feed-forward + lightweight network</text>
  <text x="24" y="56" class="muted panel-sub">XML decides what must not happen; the network decides what to do inside the allowed range.</text>

  <!-- input -->
  <rect class="box" x="24" y="90" width="180" height="120" rx="10"/>
  <text x="114" y="118" text-anchor="middle" class="panel-title" style="font-size:15px">Current state</text>
  <text x="114" y="142" text-anchor="middle" class="muted card-desc">HP · ammo · enemy range</text>
  <text x="114" y="160" text-anchor="middle" class="muted card-desc">enemy count · time left</text>
  <text x="114" y="178" text-anchor="middle" class="muted card-desc">gimbal temp · ...</text>
  <text x="114" y="200" text-anchor="middle" class="secondary card-desc">fully observable, every frame</text>

  <!-- XML layer -->
  <rect class="box" x="272" y="90" width="330" height="252" rx="12"/>
  <text x="292" y="118" class="panel-title" style="font-size:15px">XML feed-forward layer</text>
  <text x="292" y="137" class="muted card-desc">human-readable, auditable, offline-tunable</text>

  <rect class="card" x="290" y="150" width="294" height="54" rx="8"/>
  <rect class="accent-bar" x="290" y="150" width="5" height="54" rx="2.5"/>
  <text x="308" y="172" class="card-label accent-text">1 · Anchors</text>
  <text x="308" y="191" class="muted card-desc">baseline decision points: HP &lt; 30%</text>

  <rect class="card" x="290" y="212" width="294" height="54" rx="8"/>
  <rect class="amber-bar" x="290" y="212" width="5" height="54" rx="2.5"/>
  <text x="308" y="234" class="card-label amber-text">2 · Direction / bias</text>
  <text x="308" y="253" class="muted card-desc">how anchors link: chase harder below 30% HP</text>

  <rect class="card" x="290" y="274" width="294" height="54" rx="8"/>
  <rect class="warn-bar" x="290" y="274" width="5" height="54" rx="2.5"/>
  <text x="308" y="296" class="card-label warn-text">3 · Safety red lines</text>
  <text x="308" y="315" class="muted card-desc">hard clamp: forced retreat below 10% HP</text>

  <!-- network -->
  <rect class="box" x="272" y="368" width="330" height="150" rx="12"/>
  <text x="292" y="396" class="panel-title" style="font-size:15px">Lightweight network</text>
  <text x="292" y="415" class="muted card-desc">input = state features + the XML baseline intent · frozen after training</text>
  <rect class="card" x="290" y="430" width="294" height="70" rx="8"/>
  <g class="pulse">
    <circle cx="322" cy="465" r="6" fill="#0083b0" opacity=".85"/>
    <circle cx="356" cy="465" r="6" fill="#0083b0" opacity=".7"/>
    <circle cx="390" cy="465" r="6" fill="#0083b0" opacity=".55"/>
  </g>
  <text x="418" y="456" class="accent-text card-label">→ Δ</text>
  <text x="418" y="476" class="muted card-desc">continuous tweak, no new actions</text>
  <text x="292" y="508" class="muted note">Sits like PID on top of a feed-forward term.</text>

  <!-- merge -->
  <rect class="box" x="668" y="196" width="288" height="104" rx="12"/>
  <text x="812" y="226" text-anchor="middle" class="panel-title" style="font-size:15px">Baseline + Δ</text>
  <text x="812" y="250" text-anchor="middle" class="secondary card-desc">final = XML baseline + network delta</text>
  <text x="812" y="272" text-anchor="middle" class="muted card-desc">clamped by the red lines, always</text>

  <rect class="box" x="668" y="330" width="288" height="90" rx="12"/>
  <text x="812" y="358" text-anchor="middle" class="panel-title" style="font-size:15px">Decision</text>
  <text x="812" y="382" text-anchor="middle" class="secondary card-desc">continuous intent + parameters</text>
  <text x="812" y="402" text-anchor="middle" class="muted card-desc">no jump at the 30% cliff</text>

  <!-- connectors: the state feeds BOTH layers; the XML baseline also feeds the network,
       which is what makes the network a "linker" rather than an independent black box -->
  <path class="flow" d="M204 140 H272" marker-end="url(#figArchArrow)"/>
  <path class="flow" d="M204 190 C236 190 236 430 272 430" marker-end="url(#figArchArrow)"/>
  <path class="flow-dash" d="M400 342 V368" marker-end="url(#figArchArrow)"/>
  <path class="flow" d="M602 168 C640 168 636 226 668 232" marker-end="url(#figArchArrow)"/>
  <path class="flow-amber" d="M602 462 C640 462 640 280 668 264" marker-end="url(#figArchArrowAmber)"/>
  <path class="flow" d="M812 300 V330" marker-end="url(#figArchArrow)"/>

  <defs>
    <marker id="figArchArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrow" d="M0 0 L10 5 L0 10 z"/>
    </marker>
    <marker id="figArchArrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path fill="#e67e22" d="M0 0 L10 5 L0 10 z"/>
    </marker>
  </defs>

  <!-- annotations -->
  <text x="612" y="212" class="accent-text delta-tag">baseline</text>
  <text x="612" y="440" class="amber-text delta-tag">+ Δ</text>
  <text x="392" y="362" text-anchor="end" class="secondary note">XML baseline</text>
  <text x="824" y="321" class="secondary note">red-line clamp</text>

  <rect class="note-box" x="24" y="540" width="932" height="44" rx="8"/>
  <text x="42" y="567" class="secondary note">Tuning the plant means editing an XML bias value — not retraining the network, and not re-flashing the robot.</text>
</svg>
