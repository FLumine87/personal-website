<svg class="fig fig-deadlock" viewBox="0 0 940 520" width="100%" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="figDlTitle figDlDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="figDlTitle">Same stuck state, same decision skeleton — only memory differs</title>
  <desc id="figDlDesc">Two swimlanes over frames 1 to 40 of the same stuck state, where distance_to_target stays at 90000. Lane A is eve_navigation.xml without memory: all 40 frames repeat the action repeated_approach with duration 10.0s and no parameter ever changes. Lane B is eve_navigation_monitor.xml with monitors: no_progress accumulates, and at frame 32 (no_progress 31.0s) the anchor switches from local_far to local_stuck_escape and the duration changes from 10.0s to 15.0s.</desc>
