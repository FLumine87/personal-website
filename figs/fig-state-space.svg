<svg class="fig fig-state-space" viewBox="0 0 940 640" width="100%" style="max-width:100%;height:auto;display:block" role="img" aria-labelledby="figSSTitle figSSDesc" xmlns="http://www.w3.org/2000/svg">
  <title id="figSSTitle">State-space explosion — 8 parameters are enough</title>
  <desc id="figSSDesc">A horizontal log-scale bar chart. Eight sentinel input parameters are multiplied in order (HP 101, Ammo 201, Enemy range 4, Enemy HP 3, Enemy count 6, Base HP 101, Time left 601, Gimbal temp 101). The cumulative number of combinations grows from 101 to about 8.96 x 10^12, so the full state space of the sentinel is roughly nine trillion combinations.</desc>
    <style>
    .fig-state-space {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      --fig-accent: #0083b0;
      --fig-warn: #e74c3c;
      --fig-ok: #27ae60;
      --fig-amber: #e67e22;
      --fig-panel: rgba(255,255,255,.92);
    }
    [data-theme="dark"] .fig-state-space {
      --fig-accent: #3fb6d8;
      --fig-warn: #ff6b5e;
      --fig-ok: #4cd07d;
      --fig-amber: #f0a04b;
      --fig-panel: rgba(45,45,63,.95);
    }
    .fig-state-space text { fill: var(--text-primary, #2c3e50); }
    .fig-state-space .muted { fill: var(--text-tertiary, #7f8c8d); }
    .fig-state-space .secondary { fill: var(--text-secondary, #34495e); }
    .fig-state-space .ss-title { font-size: 19px; font-weight: 700; }
    .fig-state-space .ss-sub { font-size: 13.5px; }
    .fig-state-space .ss-name { font-size: 14.5px; font-weight: 600; fill: var(--text-secondary, #34495e); }
    .fig-state-space .ss-mult { font-size: 13px; }
    .fig-state-space .ss-tick { font-size: 13px; }
    .fig-state-space .ss-axis { font-size: 13px; font-weight: 600; fill: var(--text-secondary, #34495e); }
    .fig-state-space .ss-val { font-size: 14px; font-weight: 600; fill: var(--fig-accent); }
    .fig-state-space .ss-val-last { font-size: 14px; font-weight: 700; fill: var(--fig-warn); }
    .fig-state-space .ss-note { font-size: 13px; }
    .fig-state-space .ss-panel { fill: var(--fig-panel); stroke: var(--border-color, #dddddd); stroke-width: 1; }
    .fig-state-space .ss-grid { stroke: var(--border-color, #dddddd); stroke-width: 1; }
    .fig-state-space .ss-axisline { stroke: var(--border-color, #dddddd); stroke-width: 1.5; }
    .fig-state-space .ss-callout-box { fill: var(--fig-panel); stroke: var(--fig-warn); stroke-width: 1.6; }
    .fig-state-space .ss-callout-title { font-size: 19px; font-weight: 700; fill: var(--fig-warn); }
    .fig-state-space .ss-callout-sub { font-size: 13px; }
    .fig-state-space .ss-bar { transform-box: fill-box; transform-origin: 0% 50%; animation: figSSGrow .55s cubic-bezier(.2,.85,.3,1) both; }
    .fig-state-space .ss-bar-last { transform-box: fill-box; transform-origin: 0% 50%; animation: figSSGrow .65s cubic-bezier(.2,.85,.3,1) both; }
    .fig-state-space .ss-val, .fig-state-space .ss-val-last { animation: figSSFade .5s ease-out both; }
    .fig-state-space .ss-callout { animation: figSSPop .6s cubic-bezier(.2,.85,.3,1) both; }
    .fig-state-space .ss-stop-a { stop-color: var(--fig-accent); stop-opacity: 1; }
    .fig-state-space .ss-stop-b { stop-color: var(--fig-accent, #0083b0); stop-opacity: .55; }
    .fig-state-space .ss-stop-wa { stop-color: var(--fig-warn); stop-opacity: 1; }
    .fig-state-space .ss-stop-wb { stop-color: var(--fig-warn); stop-opacity: .55; }
    @keyframes figSSGrow { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @keyframes figSSFade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes figSSPop { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    @media (prefers-reduced-motion: reduce) {
      .fig-state-space .ss-bar, .fig-state-space .ss-bar-last, .fig-state-space .ss-val, .fig-state-space .ss-val-last, .fig-state-space .ss-callout {
        animation: none !important; opacity: 1 !important; transform: none !important;
      }
    }
  </style>
  <defs>
    <linearGradient id="figSSGradAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" class="ss-stop-a"/><stop offset="100%" class="ss-stop-b"/>
    </linearGradient>
    <linearGradient id="figSSGradWarn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" class="ss-stop-wa"/><stop offset="100%" class="ss-stop-wb"/>
    </linearGradient>
  </defs>
  <text x="24" y="36" class="ss-title">State-space explosion — 8 parameters are enough</text>
  <text x="24" y="60" class="muted ss-sub">Each extra parameter multiplies the combinations.</text>
  <rect class="ss-panel" x="200.0" y="92.0" width="530.0" height="370.0" rx="8"/>
  <line class="ss-grid" x1="200.0" y1="92.0" x2="200.0" y2="462.0"/>
  <line class="ss-grid" x1="200.0" y1="462.0" x2="200.0" y2="468.0"/>
  <line class="ss-grid" x1="281.5" y1="92.0" x2="281.5" y2="462.0"/>
  <line class="ss-grid" x1="281.5" y1="462.0" x2="281.5" y2="468.0"/>
  <line class="ss-grid" x1="363.1" y1="92.0" x2="363.1" y2="462.0"/>
  <line class="ss-grid" x1="363.1" y1="462.0" x2="363.1" y2="468.0"/>
  <line class="ss-grid" x1="444.6" y1="92.0" x2="444.6" y2="462.0"/>
  <line class="ss-grid" x1="444.6" y1="462.0" x2="444.6" y2="468.0"/>
  <line class="ss-grid" x1="526.2" y1="92.0" x2="526.2" y2="462.0"/>
  <line class="ss-grid" x1="526.2" y1="462.0" x2="526.2" y2="468.0"/>
  <line class="ss-grid" x1="607.7" y1="92.0" x2="607.7" y2="462.0"/>
  <line class="ss-grid" x1="607.7" y1="462.0" x2="607.7" y2="468.0"/>
  <line class="ss-grid" x1="689.2" y1="92.0" x2="689.2" y2="462.0"/>
  <line class="ss-grid" x1="689.2" y1="462.0" x2="689.2" y2="468.0"/>
  <line class="ss-axisline" x1="200.0" y1="462.0" x2="730.0" y2="462.0"/>
  <text x="200.0" y="486.0" class="muted ss-tick" text-anchor="middle">0</text>
  <text x="281.5" y="486.0" class="muted ss-tick" text-anchor="middle">2</text>
  <text x="363.1" y="486.0" class="muted ss-tick" text-anchor="middle">4</text>
  <text x="444.6" y="486.0" class="muted ss-tick" text-anchor="middle">6</text>
  <text x="526.2" y="486.0" class="muted ss-tick" text-anchor="middle">8</text>
  <text x="607.7" y="486.0" class="muted ss-tick" text-anchor="middle">10</text>
  <text x="689.2" y="486.0" class="muted ss-tick" text-anchor="middle">12</text>
  <text x="200.0" y="510.0" class="ss-axis">log10 (combinations) →</text>
  <text x="24" y="109" class="ss-name">HP</text>
  <text x="24" y="127" class="muted ss-mult">×101</text>
  <rect class="ss-bar" x="200.0" y="99" width="81.7" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:0.35s"/>
  <text x="916" y="117" class="ss-val" text-anchor="end" style="animation-delay:0.85s">101</text>
  <text x="24" y="155" class="ss-name">Ammo</text>
  <text x="24" y="173" class="muted ss-mult">×201</text>
  <rect class="ss-bar" x="200.0" y="145" width="175.6" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:0.80s"/>
  <text x="916" y="163" class="ss-val" text-anchor="end" style="animation-delay:1.30s">20,301</text>
  <text x="24" y="201" class="ss-name">Enemy range</text>
  <text x="24" y="219" class="muted ss-mult">×4</text>
  <rect class="ss-bar" x="200.0" y="191" width="200.2" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:1.25s"/>
  <text x="916" y="209" class="ss-val" text-anchor="end" style="animation-delay:1.75s">81,204</text>
  <text x="24" y="247" class="ss-name">Enemy HP</text>
  <text x="24" y="265" class="muted ss-mult">×3</text>
  <rect class="ss-bar" x="200.0" y="237" width="219.6" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:1.70s"/>
  <text x="916" y="255" class="ss-val" text-anchor="end" style="animation-delay:2.20s">243,612</text>
  <text x="24" y="293" class="ss-name">Enemy count</text>
  <text x="24" y="311" class="muted ss-mult">×6</text>
  <rect class="ss-bar" x="200.0" y="283" width="251.3" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:2.15s"/>
  <text x="916" y="301" class="ss-val" text-anchor="end" style="animation-delay:2.65s">1,461,672</text>
  <text x="24" y="339" class="ss-name">Base HP</text>
  <text x="24" y="357" class="muted ss-mult">×101</text>
  <rect class="ss-bar" x="200.0" y="329" width="333.1" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:2.60s"/>
  <text x="916" y="347" class="ss-val" text-anchor="end" style="animation-delay:3.10s">147,628,872</text>
  <text x="24" y="385" class="ss-name">Time left (s)</text>
  <text x="24" y="403" class="muted ss-mult">×601</text>
  <rect class="ss-bar" x="200.0" y="375" width="446.3" height="26" rx="3" fill="url(#figSSGradAccent)" style="animation-delay:3.05s"/>
  <text x="916" y="393" class="ss-val" text-anchor="end" style="animation-delay:3.55s">88,724,952,072</text>
  <text x="24" y="431" class="ss-name">Gimbal temp</text>
  <text x="24" y="449" class="muted ss-mult">×101</text>
  <rect class="ss-bar-last" x="200.0" y="421" width="528.1" height="26" rx="3" fill="url(#figSSGradWarn)" style="animation-delay:3.50s"/>
  <text x="916" y="439" class="ss-val-last" text-anchor="end" style="animation-delay:4.00s">8,961,220,159,272</text>
  <g class="ss-callout" style="animation-delay:4.15s">
    <rect class="ss-callout-box" x="452" y="516" width="464" height="60" rx="10"/>
    <text x="470" y="544" class="ss-callout-title">≈ 8.96 × 10¹² combinations</text>
    <text x="470" y="566" class="muted ss-callout-sub">the sentinel will meet states nobody scripted</text>
  </g>
  <text x="24" y="540" class="muted ss-note">101 × 201 × 4 × 3 × 6 × 101 × 601 × 101</text>
  <text x="24" y="562" class="muted ss-note">≈ 8.96 × 10¹² board states</text>
</svg>
